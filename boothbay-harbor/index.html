<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boothbay Harbor">
<title>Boothbay Harbor Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap');

  :root {
    --bg:      #0c0616;
    --surface: #170f24;
    --surface2:#211735;
    --indigo:  #3a1866;
    --gold:    #e88c36;
    --gold-br: #ffc478;
    --magenta: #d8508a;
    --magenta-br: #f078b0;
    --text:    #ece0f0;
    --subtext: #9884ac;
    --radius:  14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: radial-gradient(120% 140% at 50% 0%, #4a1f7a 0%, var(--bg) 70%);
    padding: 1.5rem 1.25rem 2.25rem;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #2a1c40;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--indigo), var(--magenta-br), var(--gold-br), var(--magenta-br), var(--indigo));
    opacity: 0.85;
  }

  .header-glyph {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 15px;
    opacity: 0.4;
    letter-spacing: 5px;
    color: var(--gold-br);
  }

  .title-icon { font-size: 1.3rem; margin-right: 0.15rem; filter: drop-shadow(0 0 6px rgba(232,140,54,0.55)); }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.65rem;
    color: var(--text);
    letter-spacing: 0.06em;
    font-weight: 600;
    text-shadow: 0 0 18px rgba(216,80,138,0.3);
  }

  header p {
    color: var(--subtext);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.35rem;
    font-weight: 300;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    padding: 1.25rem 1.25rem 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--subtext);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #2c1f42;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--indigo), var(--magenta), var(--gold));
    box-shadow: 0 0 8px rgba(216,80,138,0.5);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* SECTION CHIP */
  .section-chip {
    margin: 1rem 1.25rem 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid #2e2148;
    color: var(--gold-br);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
  }

  .section-chip span.dot {
    width: 6px; height: 6px;
    background: var(--magenta-br);
    box-shadow: 0 0 6px var(--magenta-br);
    border-radius: 50%;
    display: inline-block;
  }

  /* ROW CARD */
  .row-card {
    margin: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid #241a38;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    overflow: hidden;
    position: relative;
  }

  .row-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--indigo), var(--magenta), var(--gold), var(--magenta), var(--indigo));
    z-index: 1;
  }

  .row-card-header {
    background: linear-gradient(135deg, #2a1848, #4a2258);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .row-number {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 600;
  }

  .row-side {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    white-space: nowrap;
    display: none;
  }

  .row-side.show { display: inline-block; }
  .row-side.rs { background: var(--gold-br); color: #3a2308; }
  .row-side.setup { background: rgba(255,255,255,0.12); color: var(--text); }
  .row-side.finish { background: var(--magenta-br); color: #3a1224; }

  .row-instructions {
    padding: 1.1rem 1.25rem;
    font-size: 0.92rem;
    line-height: 1.65;
    color: var(--text);
  }

  .stitch-note {
    margin-top: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: var(--surface2);
    border-left: 3px solid var(--gold-br);
    border-radius: 0 8px 8px 0;
    font-size: 0.8rem;
    color: var(--subtext);
    line-height: 1.5;
    display: none;
  }

  .stitch-note.show { display: block; }

  /* NAVIGATION */
  .nav-area {
    padding: 1.25rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .btn {
    flex: 1;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-prev {
    background: var(--surface2);
    color: var(--subtext);
    border: 1px solid #2c1f42;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--magenta), var(--gold));
    color: #1c0e28;
    box-shadow: 0 3px 14px rgba(216,80,138,0.35);
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* STITCH COUNT */
  .stitch-count {
    margin: 0 1.25rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--subtext);
  }

  .stitch-count strong {
    font-size: 1.1rem;
    color: var(--gold-br);
    font-family: 'Cinzel', serif;
  }

  /* COMPLETION */
  .completion {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    text-align: center;
  }

  .completion.show { display: flex; }

  .completion-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 10px rgba(232,140,54,0.45));
  }

  .completion h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .completion p {
    color: var(--subtext);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* DECORATIVE FOOTER */
  .deco {
    text-align: center;
    font-size: 15px;
    opacity: 0.3;
    padding: 4px 0 0;
    letter-spacing: 8px;
  }
</style>
</head>
<body>

<header>
  <span class="header-glyph">&#127945; &#127955; &#127945;</span>
  <h1><span class="title-icon">&#127955;</span> Boothbay Harbor</h1>
  <p>Crochet Shawl &middot; Marly Bird &amp; Robyn Chachula &middot; Sirdar Jewelspun &middot; Tourmaline Dream</p>
</header>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="progress-text">Loading...</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="section-chip">
  <span class="dot"></span>
  <span id="section-label">Body</span>
</div>

<div class="row-card" id="row-card">
  <div class="row-card-header">
    <span class="row-number" id="row-display">Row &mdash;</span>
    <span class="row-side" id="row-side-badge"></span>
  </div>
  <div class="row-instructions" id="row-instructions">Loading...</div>
  <div class="stitch-note" id="stitch-note"></div>
</div>

<div class="stitch-count" id="stitch-count-display"></div>

<div class="deco">&#127945; &#127955; &#127946; &#127955; &#127945;</div>

<div class="nav-area">
  <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">&larr; Back</button>
  <button class="btn btn-next" id="btn-next" onclick="navigate(1)">Next &rarr;</button>
</div>

<div class="completion" id="completion">
  <div class="completion-icon">&#127955;</div>
  <h2>Boothbay Harbor Complete!</h2>
  <p>Pin to schematic size (68.5" x 37") and steam block, holding the iron at least an inch above the fabric.</p>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'boothbayharbor_row';
let currentIndex = parseInt(localStorage.getItem(STORAGE_KEY) ?? 0);
if (isNaN(currentIndex) || currentIndex < 0) currentIndex = 0;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const total = PATTERN.length;
  const row = PATTERN[currentIndex];

  localStorage.setItem(STORAGE_KEY, currentIndex);

  const pct = Math.round((currentIndex / (total - 1)) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `Row ${currentIndex + 1} of ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';

  document.getElementById('section-label').textContent = currentIndex >= 58 ? 'Edging' : 'Body';

  document.getElementById('row-display').textContent = row.rowLabel;
  const badge = document.getElementById('row-side-badge');
  if (row.side && row.side.length > 0) {
    badge.textContent = row.side;
    badge.className = 'row-side show ' + row.side.toLowerCase();
  } else {
    badge.className = 'row-side';
  }

  document.getElementById('row-instructions').innerHTML = row.instructions.replace(/\n/g, '<br>');

  const noteEl = document.getElementById('stitch-note');
  if (row.context && row.context.length > 0) {
    noteEl.classList.add('show');
    noteEl.textContent = row.context;
  } else {
    noteEl.classList.remove('show');
  }

  const scEl = document.getElementById('stitch-count-display');
  if (row.stitchCount) {
    scEl.innerHTML = `<strong>${row.stitchCount}</strong> stitches`;
  } else {
    scEl.innerHTML = '';
  }

  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = currentIndex === total - 1;

  const isLast = currentIndex === total - 1;
  document.getElementById('completion').classList.toggle('show', isLast);
  document.getElementById('row-card').style.display = isLast ? 'none' : 'block';
  document.getElementById('stitch-count-display').style.display = isLast ? 'none' : 'flex';
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next >= 0 && next < PATTERN.length) {
    currentIndex = next;
    render();
  }
}

render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
