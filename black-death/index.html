  <meta name="apple-mobile-web-app-title" content="Black Death" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />

  <title>Black Death Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #131313;
      --surface2: #1c1c1c;
      --bone: #e8e0d0;
      --blood: #b85c00;
      --blood-bright: #e8740a;
      --purple: #4a1942;
      --purple-mid: #7b2d8b;
      --purple-bright: #b15dcc;
      --muted: #666;
      --text: #d4cfc8;
      --radius: 10px;
    }

    @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid #222;
      background: linear-gradient(180deg, #1a0d00 0%, #0a0a0a 100%);
      position: relative;
      overflow: hidden;
    }

    .header-bats {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 18px;
      opacity: 0.4;
      letter-spacing: 4px;
    }

    .brand {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--purple-bright);
      margin-bottom: 2px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      color: var(--bone);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    h1 .skull { font-size: 22px; margin-right: 4px; }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── VERSION TOGGLE ── */
    .version-toggle {
      display: flex;
      gap: 8px;
    }

    .version-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .version-btn.active {
      background: var(--blood);
      border-color: var(--blood-bright);
      color: var(--bone);
      font-weight: 700;
    }

    /* ── SIZE TOGGLE ── */
    .size-toggle {
      display: flex;
      gap: 8px;
    }

    .size-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }

    .size-btn.active {
      background: var(--purple);
      border-color: var(--purple-bright);
      color: var(--purple-bright);
      font-weight: 700;
    }

    /* ── STEP CARD ── */
    .step-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
      border: 1px solid #222;
      position: relative;
      overflow: hidden;
    }

    .step-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blood), var(--purple-bright), var(--blood));
    }

    .step-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .step-number {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      color: var(--bone);
      letter-spacing: -0.04em;
    }

    .step-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .step-meta .rs { color: var(--blood-bright); font-weight: 600; }
    .step-meta .ws { color: var(--purple-bright); font-weight: 600; }
    .step-meta .sts { color: var(--bone); font-weight: 600; }

    /* ── INSTRUCTION CARD ── */
    .instruction-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid #222;
      overflow: hidden;
    }

    .instruction-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      background: var(--surface2);
    }

    .section-badge {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--purple-bright);
      background: var(--purple);
      padding: 3px 8px;
      border-radius: 99px;
    }

    .row-side {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .row-side.rs { color: var(--blood-bright); }
    .row-side.ws { color: var(--purple-bright); }
    .row-side.setup { color: var(--bone); }

    .instruction-body {
      padding: 14px;
      font-size: 18px;
      line-height: 1.65;
      color: var(--text);
     font-family: 'Cinzel', Georgia, serif; 
    }

    .instruction-body .abbr {
      color: var(--bone);
      font-weight: 700;
    }

    .stitch-count {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #222;
      font-size: 12px;
      color: var(--muted);
      font-family: -apple-system, sans-serif;
    }

    .stitch-count strong { color: var(--bone); }

    /* ── STOP ALERT ── */
    .stop-alert {
      background: #1a0800;
      border: 1px solid var(--blood);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--blood-bright);
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .stop-alert.visible { display: block; }

    /* ── CONTROLS ── */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      padding: 20px 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      font-size: 22px;
    }

    .btn:active { transform: scale(0.96); opacity: 0.8; }

    .btn-prev {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid #2a2a2a;
    }

    .btn-next {
      background: var(--blood);
      color: var(--bone);
    }

    .btn-wide {
      grid-column: 1 / -1;
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      padding: 13px;
      border: 1px solid #2a2a2a;
    }

    /* ── PROGRESS ── */
    .progress-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 14px;
      border: 1px solid #222;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      background: #222;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blood), var(--purple-bright));
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* ── RESET ── */
    .reset-btn {
      background: none;
      border: 1px solid #222;
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      padding: 10px;
      cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .reset-btn:active { opacity: 0.5; }

    /* ── DECORATIVE FOOTER ── */
    .deco {
      text-align: center;
      font-size: 16px;
      opacity: 0.2;
      padding: 4px 0 8px;
      letter-spacing: 8px;
    }

</head>

  </div>

  <div class="step-card">
    <div class="step-label">Current Step</div>
    <div class="step-number" id="step-display">1</div>
    <div class="step-meta" id="step-meta">—</div>
  </div>

  <div class="stop-alert" id="stop-alert"></div>

  <div class="instruction-card">
    <div class="instruction-header">
      <span class="section-badge" id="section-badge">Setup</span>
      <span class="row-side" id="row-side">—</span>
    </div>
    <div class="instruction-body" id="instruction-body">—</div>
  </div>

  <div class="controls">
    <button class="btn btn-prev" onclick="changeStep(-1)">←</button>
    <button class="btn btn-next" onclick="changeStep(1)">→</button>
    <button class="btn btn-wide" onclick="jumpToStep()">💀 Jump to step…</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-header">
      <span>🦇 Progress</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <button class="reset-btn" onclick="confirmReset()">🕸️ Reset to Step 1</button>

  <div class="deco">💀 🦇 💀 🦇 💀</div>

</main>

// ── STATE ──
var KEY_VERSION = 'black-death-version';
var currentVersion = 'crimson';
var currentStep = 1;
var currentSize = 'large';

var STOP_SMALL = 74; // row index (1-based step)
var STOP_LARGE = 90;
var TOTAL_STEPS = ROWS.length;

function stepKey() { return 'black-death-' + currentVersion + '-step'; }
function sizeKey() { return 'black-death-' + currentVersion + '-size'; }

function loadState() {
  var savedVersion = localStorage.getItem(KEY_VERSION);
  if (savedVersion) currentVersion = savedVersion;
  var saved = localStorage.getItem(stepKey());
  currentStep = saved ? parseInt(saved, 10) : 1;
  var savedSize = localStorage.getItem(sizeKey());
  currentSize = savedSize || 'large';
}

function saveState() {
  localStorage.setItem(KEY_VERSION, currentVersion);
  localStorage.setItem(stepKey(), currentStep);
  localStorage.setItem(sizeKey(), currentSize);
}

function setVersion(v) {
  currentVersion = v;
  var saved = localStorage.getItem(stepKey());
  currentStep = saved ? parseInt(saved, 10) : 1;
  var savedSize = localStorage.getItem(sizeKey());
  currentSize = savedSize || 'large';
  saveState();
  render();
}

function getRow() {
  return ROWS[currentStep - 1] || ROWS[0];
}

function getStopStep() {
  return currentSize === 'small' ? STOP_SMALL : STOP_LARGE;
}

function render() {
  var row = getRow();
  var stopAt = getStopStep();

  // Step number
  document.getElementById('step-display').textContent = currentStep;

  // Meta line
  var patternRow = currentStep <= 6 ? 'Setup Row ' + currentStep : 'Pattern Row ' + (currentStep - 1);
  document.getElementById('step-meta').innerHTML =
    '<span class="' + row.side.toLowerCase() + '">' + row.side + '</span>' +
    ' &nbsp;·&nbsp; ' + patternRow +
    ' &nbsp;·&nbsp; <span class="sts">' + row.stitches + '</span>';

  // Section badge
  document.getElementById('section-badge').textContent = row.section;

  // Row side label
  var sideEl = document.getElementById('row-side');
  sideEl.textContent = row.side === 'RS' ? '→ Right Side' : row.side === 'WS' ? '← Wrong Side' : '⚙ Setup';
  sideEl.className = 'row-side ' + row.side.toLowerCase();

  // Instruction
  document.getElementById('instruction-body').innerHTML =
    '<div>' + row.instruction.replace(/\n\n/g, '<br><br>') + '</div>' +
    '<div class="stitch-count">After this row: <strong>' + row.stitches + '</strong></div>';

  // Stop alert
  var alert = document.getElementById('stop-alert');
  if (currentStep === stopAt) {
    alert.textContent = '🛑 ' + (currentSize === 'small' ? 'SMALL' : 'LARGE') + ' SHAWL STOP POINT — begin lace edging after this row!';
    alert.classList.add('visible');
  } else if (currentStep === stopAt - 1) {
    alert.textContent = '⚠️ Next row is your stop point for the ' + (currentSize === 'small' ? 'small' : 'large') + ' shawl.';
    alert.classList.add('visible');
  } else {
    alert.classList.remove('visible');
  }

  // Progress
  var pct = Math.min(Math.round((currentStep / TOTAL_STEPS) * 100), 100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  // Size buttons
  document.getElementById('btn-small').classList.toggle('active', currentSize === 'small');
  document.getElementById('btn-large').classList.toggle('active', currentSize === 'large');

  // Version buttons
  document.getElementById('btn-crimson').classList.toggle('active', currentVersion === 'crimson');
  document.getElementById('btn-lovely').classList.toggle('active', currentVersion === 'lovely');
}

function changeStep(delta) {
  currentStep = Math.max(1, Math.min(TOTAL_STEPS, currentStep + delta));
  saveState();
  render();
}

function setSize(size) {
  currentSize = size;
  saveState();
  render();
}

function jumpToStep() {
  var input = prompt('Jump to step (1–' + TOTAL_STEPS + '):');
  if (!input) return;
  var n = parseInt(input, 10);
  if (!isNaN(n) && n >= 1 && n <= TOTAL_STEPS) {
    currentStep = n;
    saveState();
    render();
  } else {
    alert('Please enter a number between 1 and ' + TOTAL_STEPS);
  }
}

function confirmReset() {
  if (confirm('Reset to Step 1? Your progress will be lost.')) {
    currentStep = 1;
    saveState();
    render();
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(e) {
    console.log('SW registration failed:', e);
  });
}

loadState();
render();
</script>
