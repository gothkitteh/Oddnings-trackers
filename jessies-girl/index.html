<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jessie's Girl">
<title>Jessie's Girl Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Lato:wght@300;400;700&display=swap');

  :root {
    --bg:      #070310;
    --surface: #190f28;
    --surface2:#28193d;
    --deep:    #3d1566;
    --magenta: #ec5cd6;
    --magenta-br: #ff6fe8;
    --cerulean: #4fd4f2;
    --cerulean-br: #7be8ff;
    --lavender: #b06bf0;
    --text:    #ecdff5;
    --subtext: #9c86b0;
    --radius:  14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: radial-gradient(120% 140% at 50% 0%, #5a1f96 0%, var(--bg) 70%);
    padding: 1.5rem 1.25rem 2.25rem;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #29173d;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--magenta-br), var(--cerulean-br), transparent);
    opacity: 0.8;
  }

  .header-glyph {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 15px;
    opacity: 0.4;
    letter-spacing: 5px;
    color: var(--magenta-br);
  }

  .title-icon { font-size: 1.3rem; margin-right: 0.15rem; filter: drop-shadow(0 0 6px rgba(214,110,200,0.6)); }

  header h1 {
    font-family: 'Righteous', cursive;
    font-size: 1.75rem;
    color: var(--text);
    letter-spacing: 0.03em;
    font-weight: 400;
    text-shadow: 0 0 22px rgba(236,92,214,0.65);
  }

  header p {
    color: var(--lavender);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 0.35rem;
    font-weight: 300;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    padding: 1.25rem 1.25rem 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--subtext);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #2c1c40;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--magenta), var(--cerulean));
    box-shadow: 0 0 8px rgba(214,110,200,0.55);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* SECTION CHIP */
  .section-chip {
    margin: 1rem 1.25rem 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid #33204a;
    color: var(--cerulean-br);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
  }

  .section-chip span.dot {
    width: 6px; height: 6px;
    background: var(--magenta-br);
    box-shadow: 0 0 6px var(--magenta-br);
    border-radius: 50%;
    display: inline-block;
  }

  /* ROW CARD */
  .row-card {
    margin: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid #29173d;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
  }

  .row-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--magenta), var(--cerulean), var(--magenta));
    z-index: 1;
  }

  .row-card-header {
    background: linear-gradient(135deg, var(--deep), var(--magenta));
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .row-number {
    font-family: 'Righteous', cursive;
    font-size: 1.05rem;
    color: var(--text);
    font-weight: 400;
  }

  .row-side {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    white-space: nowrap;
  }

  .row-side.rs { background: rgba(255,255,255,0.12); color: var(--cerulean-br); }
  .row-side.ws { background: var(--magenta-br); color: #3a0a30; }
  .row-side.rnd { background: var(--lavender); color: #200a38; }
  .row-side.setup { background: rgba(255,255,255,0.1); color: var(--text); }
  .row-side.finish { background: var(--cerulean-br); color: #052430; }

  .row-instructions {
    padding: 1.1rem 1.25rem;
    font-size: 0.92rem;
    line-height: 1.65;
    color: var(--text);
  }

  .stitch-note {
    margin-top: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: var(--surface2);
    border-left: 3px solid var(--cerulean-br);
    border-radius: 0 8px 8px 0;
    font-size: 0.8rem;
    color: var(--subtext);
    line-height: 1.5;
  }

  /* CONTEXT NOTE */
  .context-note {
    margin: 0 1.25rem;
    padding: 0.75rem 1rem;
    background: var(--surface2);
    border: 1px solid #33204a;
    border-radius: 10px;
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.5;
    display: none;
  }

  .context-note.show { display: block; }

  .context-note strong {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.25rem;
    color: var(--subtext);
  }

  /* NAVIGATION */
  .nav-area {
    padding: 1.25rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .btn {
    flex: 1;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-prev {
    background: var(--surface2);
    color: var(--lavender);
    border: 1px solid #33204a;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--magenta), var(--cerulean));
    color: #0c0614;
    box-shadow: 0 3px 14px rgba(214,110,200,0.4);
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* STITCH COUNT */
  .stitch-count {
    margin: 0 1.25rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--subtext);
  }

  .stitch-count strong {
    font-size: 1.1rem;
    color: var(--magenta-br);
    font-family: 'Righteous', cursive;
    font-weight: 400;
  }

  /* COMPLETION */
  .completion {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    text-align: center;
  }

  .completion.show { display: flex; }

  .completion-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 10px rgba(214,110,200,0.5));
  }

  .completion h2 {
    font-family: 'Righteous', cursive;
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .completion p {
    color: var(--subtext);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* DECORATIVE FOOTER */
  .deco {
    text-align: center;
    font-size: 15px;
    opacity: 0.3;
    padding: 4px 0 0;
    letter-spacing: 8px;
  }
</style>
</head>
<body>

<header>
  <span class="header-glyph">&#9889; &#129419; &#9889;</span>
  <h1><span class="title-icon">&#129419;</span> Jessie's Girl</h1>
  <p>Sleeveless Pullover &middot; Elizabeth Smith Knits &middot; Size 3 &middot; Mandala Mothra</p>
</header>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="progress-text">Loading...</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="section-chip">
  <span class="dot"></span>
  <span id="section-label">Loading...</span>
</div>

<div class="row-card" id="row-card">
  <div class="row-card-header">
    <span class="row-number" id="row-display">Row &mdash;</span>
    <span class="row-side" id="row-side-badge">RS</span>
  </div>
  <div class="row-instructions" id="row-instructions">Loading...</div>
  <div class="stitch-note" id="stitch-note"></div>
</div>

<div class="stitch-count" id="stitch-count-display"></div>

<div class="context-note" id="context-note"></div>

<div class="deco">&#127925; &#9889; &#129419; &#9889; &#127925;</div>

<div class="nav-area">
  <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">&larr; Back</button>
  <button class="btn btn-next" id="btn-next" onclick="navigate(1)">Next &rarr;</button>
</div>

<div class="completion" id="completion">
  <div class="completion-icon">&#129419;</div>
  <h2>Jessie's Girl Complete!</h2>
  <p>Weave in ends and block to schematic measurements:<br>bust 52", front/back width 26", armhole depth 8".</p>
</div>

// ─── STATE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'jessiesgirl_row';
let currentIndex = parseInt(localStorage.getItem(STORAGE_KEY) ?? 0);
if (isNaN(currentIndex) || currentIndex < 0) currentIndex = 0;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const total = PATTERN.length;
  const row = PATTERN[currentIndex];

  localStorage.setItem(STORAGE_KEY, currentIndex);

  const pct = Math.round((currentIndex / (total - 1)) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `Step ${currentIndex + 1} of ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';

  document.getElementById('section-label').textContent = row.section;

  document.getElementById('row-display').textContent = row.rowLabel;
  const badge = document.getElementById('row-side-badge');
  badge.textContent = row.side;
  badge.className = 'row-side ' + row.side.toLowerCase();

  document.getElementById('row-instructions').innerHTML =
    row.instructions.replace(/\n/g, '<br>');

  const noteEl = document.getElementById('stitch-note');
  if (row.stitchCount) {
    noteEl.style.display = 'block';
    noteEl.textContent = `Stitch count after this step: ${row.stitchCount} sts`;
  } else {
    noteEl.style.display = 'none';
  }

  const scEl = document.getElementById('stitch-count-display');
  if (row.stitchCount) {
    scEl.innerHTML = `<strong>${row.stitchCount}</strong> stitches`;
  } else {
    scEl.innerHTML = '';
  }

  const ctxEl = document.getElementById('context-note');
  if (row.context && row.context.length > 0) {
    ctxEl.innerHTML = `<strong>Note</strong>${row.context}`;
    ctxEl.classList.add('show');
  } else {
    ctxEl.classList.remove('show');
  }

  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = currentIndex === total - 1;

  const isLast = currentIndex === total - 1;
  document.getElementById('completion').classList.toggle('show', isLast);
  document.getElementById('row-card').style.display = isLast ? 'none' : 'block';
  document.getElementById('context-note').style.display = isLast ? 'none' : (row.context ? 'block' : 'none');
  document.getElementById('stitch-count-display').style.display = isLast ? 'none' : 'flex';
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next >= 0 && next < PATTERN.length) {
    currentIndex = next;
    render();
  }
}

render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
