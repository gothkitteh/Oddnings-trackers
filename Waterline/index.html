<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waterline">
<title>Waterline Shawl Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');

  :root {
    --bg:      #060d10;
    --surface: #0c1a1f;
    --surface2:#122730;
    --deep:    #0e2b36;
    --wave:    #2a8fa8;
    --wave-br: #5fd3e8;
    --foam:    #cdeef4;
    --mist:    #6f97a1;
    --accent:  #e8c07c;
    --text:    #d8eef2;
    --subtext: #6f97a1;
    --radius:  14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: radial-gradient(120% 140% at 50% 0%, #12333e 0%, var(--bg) 70%);
    padding: 1.5rem 1.25rem 2.25rem;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #132a31;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--wave-br), transparent);
    opacity: 0.7;
  }

  .header-glyph {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 15px;
    opacity: 0.35;
    letter-spacing: 5px;
    color: var(--foam);
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.65rem;
    color: var(--foam);
    letter-spacing: 0.09em;
    font-weight: 600;
  }

  header p {
    color: var(--mist);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 0.3rem;
    font-weight: 300;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    padding: 1.25rem 1.25rem 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--subtext);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #16323b;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--wave), var(--wave-br));
    box-shadow: 0 0 8px rgba(95,211,232,0.6);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* SECTION CHIP */
  .section-chip {
    margin: 1rem 1.25rem 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface2);
    border: 1px solid #1d3d47;
    color: var(--wave-br);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
  }

  .section-chip span.dot {
    width: 6px; height: 6px;
    background: var(--wave-br);
    box-shadow: 0 0 6px var(--wave-br);
    border-radius: 50%;
    display: inline-block;
  }

  /* ROW CARD */
  .row-card {
    margin: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid #16323b;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
  }

  .row-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--wave), var(--wave-br), var(--wave));
    z-index: 1;
  }

  .row-card-header {
    background: linear-gradient(135deg, var(--deep), var(--wave));
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .row-number {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--foam);
    font-weight: 600;
  }

  .row-side {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
  }

  .row-side.rs {
    background: rgba(255,255,255,0.12);
    color: var(--wave-br);
  }

  .row-side.ws {
    background: var(--accent);
    color: #3a2400;
  }

  .row-instructions {
    padding: 1.1rem 1.25rem;
    font-size: 0.92rem;
    line-height: 1.65;
    color: var(--text);
  }

  .stitch-note {
    margin-top: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: var(--surface2);
    border-left: 3px solid var(--wave-br);
    border-radius: 0 8px 8px 0;
    font-size: 0.8rem;
    color: var(--subtext);
    line-height: 1.5;
  }

  /* WAVE CONTEXT */
  .wave-context {
    margin: 0 1.25rem;
    padding: 0.75rem 1rem;
    background: var(--surface2);
    border: 1px solid #1d3d47;
    border-radius: 10px;
    font-size: 0.78rem;
    color: var(--foam);
    line-height: 1.5;
  }

  .wave-context strong {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.25rem;
    color: var(--subtext);
  }

  /* NAVIGATION */
  .nav-area {
    padding: 1.25rem;
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .btn {
    flex: 1;
    padding: 0.9rem;
    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-prev {
    background: var(--surface2);
    color: var(--mist);
    border: 1px solid #1d3d47;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--wave), var(--wave-br));
    color: #04141a;
    box-shadow: 0 3px 14px rgba(95,211,232,0.35);
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* STITCH COUNT */
  .stitch-count {
    margin: 0 1.25rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--subtext);
  }

  .stitch-count strong {
    font-size: 1.1rem;
    color: var(--wave-br);
    font-family: 'Cinzel', serif;
  }

  /* COMPLETION */
  .completion {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    text-align: center;
  }

  .completion.show { display: flex; }

  .completion-wave {
    font-size: 3rem;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 10px rgba(95,211,232,0.5));
  }

  .completion h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--foam);
    margin-bottom: 0.5rem;
  }

  .completion p {
    color: var(--subtext);
    font-size: 0.9rem;
    line-height: 1.6;
  }


  .title-icon { font-size: 1.3rem; margin-right: 0.15rem; filter: drop-shadow(0 0 6px rgba(95,211,232,0.5)); }

  .deco {
    text-align: center;
    font-size: 15px;
    opacity: 0.3;
    padding: 4px 0 0;
    letter-spacing: 8px;
  }
</style>
</head>
<body>

<header>
  <span class="header-glyph">🌊 🌙 🌊</span>
  <h1><span class="title-icon">🌙</span> Waterline</h1>
  <p>Shawl Tracker · Red Heart · Ann Weaver</p>
</header>

<div class="progress-wrap">
  <div class="progress-label">
    <span>🌊 <span id="progress-text">Loading...</span></span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
</div>

<div class="section-chip">
  <span class="dot"></span>
  <span id="section-label">Loading...</span>
</div>

<div class="jump-row" style="display:flex; gap:0.5rem; margin: 0.75rem 0;">
  <input type="text" id="jump-section" placeholder="e.g. Wave Section 3" style="flex:2; padding:0.6rem; border-radius:8px; border:1px solid #444; background:#1c1c22; color:#eee; font-size:0.85rem;">
  <input type="text" id="jump-row" placeholder="Row (e.g. 1 or Rep 2 Row 3)" style="flex:2; padding:0.6rem; border-radius:8px; border:1px solid #444; background:#1c1c22; color:#eee; font-size:0.85rem;">
  <button onclick="jumpToRow()" style="flex:1; padding:0.6rem; border-radius:8px; border:none; background:#5a4fcf; color:white; font-weight:600; font-size:0.85rem;">Go</button>
</div>
<div id="jump-feedback" style="font-size:0.8rem; color:#f0a; min-height:1.1em; margin-bottom:0.5rem;"></div>

<div class="row-card" id="row-card">
  <div class="row-card-header">
    <span class="row-number" id="row-display">Row —</span>
    <span class="row-side" id="row-side-badge">RS</span>
  </div>
  <div class="row-instructions" id="row-instructions">Loading...</div>
  <div class="stitch-note" id="stitch-note"></div>
</div>

<div class="stitch-count" id="stitch-count-display"></div>

<div class="wave-context" id="wave-context"></div>

<div class="deco">🌙 〰️ 🌊 〰️ 🌙</div>

<div class="nav-area">
  <button class="btn btn-prev" id="btn-prev" onclick="navigate(-1)">← Back</button>
  <button class="btn btn-next" id="btn-next" onclick="navigate(1)">Next Row →</button>
</div>

<div class="completion" id="completion">
  <div class="completion-wave">🌊</div>
  <h2>Waterline Complete!</h2>
  <p>Weave in ends, wet block to measurements,<br>and pin out the lace points while damp.</p>
</div>

<script>
// ─── PATTERN DATA ────────────────────────────────────────────────────────────

const PATTERN = [];

function addRow(section, rowLabel, side, instructions, stitchCount, context) {
  PATTERN.push({ section, rowLabel, side, instructions, stitchCount, context });
}

// SETUP
addRow('Setup', 'Cast On', 'RS', 'Cast on 1 st.', 1, 'Cast on and begin building the spine of the shawl.');
addRow('Setup', 'Row 1', 'RS', 'Kfbf — 3 sts.\n\nkfbf: Knit into the front, then back, then front of next stitch = 2 sts increased.', 3, 'Setup section: building initial stitches.');
addRow('Setup', 'Row 2', 'WS', 'K1, place marker, k2.', 3, 'Setup section.');
addRow('Setup', 'Row 3', 'RS', 'K1, yo, k1, slip marker, k1 — 4 sts.', 4, 'Setup section.');
addRow('Setup', 'Row 4', 'WS', 'Knit.', 4, 'Setup section. Plain knit row.');
addRow('Setup', 'Row 5', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 5, 'Setup section. Repeat rows 4-5 sixteen more times.');

// Setup rows 4-5 repeat x16 (rows 6-37 in sequence = 16 more pairs)
let setupSt = 5;
for (let i = 1; i <= 16; i++) {
  addRow('Setup', `Row 4–5 Rep ${i} (knit)`, 'WS', 'Knit.', setupSt, `Setup repeat ${i} of 16.`);
  setupSt++;
  addRow('Setup', `Row 4–5 Rep ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', setupSt, `Setup repeat ${i} of 16. After all 16 repeats + 1 more knit row: 21 sts.`);
}
addRow('Setup', 'Row 4 final', 'WS', 'Knit. — 21 sts total.', 21, 'Final plain row of Setup. Ready for Wave Section 1.');

// WAVE SECTION 1
addRow('Wave Section 1', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 22 sts.', 22, 'Wave Section 1 begins. 20 sts before marker, 2 after.');
// Setup repeat x17 then one more knit
let ws1c = 22;
for (let i = 1; i <= 17; i++) {
  addRow('Wave Section 1', `Setup Rep ${i} (knit)`, 'WS', 'Knit.', ws1c, `Wave 1 growth repeat ${i} of 17.`);
  ws1c++;
  addRow('Wave Section 1', `Setup Rep ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws1c, `Wave 1 growth repeat ${i} of 17.`);
}
addRow('Wave Section 1', 'Row 4 final', 'WS', 'Knit. — 39 sts total (20 before marker, 19 after).', 39, 'End of Wave Section 1. Ready for Wave Section 2.');

// WAVE SECTION 2
addRow('Wave Section 2', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, [k1, yo] 6 times, [k2tog] 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 40 sts.', 40, 'Wave Section 2 begins. 3 repeats of waves total in this section.');
addRow('Wave Section 2', 'Row 2', 'WS', 'Knit.', 40, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 3', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 41, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 4', 'WS', 'Knit.', 41, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 5', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 42, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 6', 'WS', 'Knit.', 42, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 7', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 43, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 8', 'WS', 'Knit.', 43, 'Wave Section 2.');
addRow('Wave Section 2', 'Row 9 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, [k1, yo] 6 times, [k2tog] 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 44, 'Wave row! Repeat rows 3-10 once more for 3 waves total.');
addRow('Wave Section 2', 'Row 10', 'WS', 'Knit.', 44, 'Wave Section 2. Then repeat rows 3-10 once more.');
// Second repeat of rows 3-10
addRow('Wave Section 2', 'Rep 2 Row 3', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 45, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 4', 'WS', 'Knit.', 45, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 5', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 46, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 6', 'WS', 'Knit.', 46, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 7', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 47, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 8', 'WS', 'Knit.', 47, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 9 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, [k1, yo] 6 times, [k2tog] 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 48, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
addRow('Wave Section 2', 'Rep 2 Row 10', 'WS', 'Knit.', 48, 'Wave Section 2 repeat 1 of 1 (3 waves total per pattern).');
// Growth rows 4-5 x9 then knit
let ws2c = 48;
for (let i = 1; i <= 9; i++) {
  addRow('Wave Section 2', `Growth ${i} (knit)`, 'WS', 'Knit.', ws2c, `Wave 2 growth rep ${i} of 9.`);
  ws2c++;
  addRow('Wave Section 2', `Growth ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws2c, `Wave 2 growth rep ${i} of 9.`);
}
addRow('Wave Section 2', 'Growth final knit', 'WS', 'Knit. — 57 sts total (20 before marker, 37 after).', 57, 'End of Wave Section 2. Ready for Wave Section 3.');

// WAVE SECTION 3
addRow('Wave Section 3', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 2 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 58 sts.', 58, 'Wave Section 3 begins. 5 waves total in this section.');
addRow('Wave Section 3', 'Row 2', 'WS', 'Knit.', 58, 'Wave Section 3.');
addRow('Wave Section 3', 'Row 3', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 59, 'Wave Section 3.');
addRow('Wave Section 3', 'Row 4', 'WS', 'Knit.', 59, 'Wave Section 3.');
addRow('Wave Section 3', 'Row 5', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 60, 'Wave Section 3.');
addRow('Wave Section 3', 'Row 6', 'WS', 'Knit.', 60, 'Wave Section 3.');
addRow('Wave Section 3', 'Row 7 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 2 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 61, 'Wave row! Repeat rows 3-8 three more times for 5 waves total.');
addRow('Wave Section 3', 'Row 8', 'WS', 'Knit.', 61, 'Wave Section 3.');
let ws3c = 61;
for (let rep = 2; rep <= 4; rep++) {
  ws3c++;
  addRow('Wave Section 3', `Rep ${rep} Row 3`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
  addRow('Wave Section 3', `Rep ${rep} Row 4`, 'WS', 'Knit.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
  ws3c++;
  addRow('Wave Section 3', `Rep ${rep} Row 5`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
  addRow('Wave Section 3', `Rep ${rep} Row 6`, 'WS', 'Knit.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
  ws3c++;
  addRow('Wave Section 3', `Rep ${rep} Row 7 (wave)`, 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 2 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
  addRow('Wave Section 3', `Rep ${rep} Row 8`, 'WS', 'Knit.', ws3c, `Wave Section 3 repeat ${rep-1} of 3 (5 waves total per pattern).`);
}
let ws3g = 70;
for (let i = 1; i <= 23; i++) {
  addRow('Wave Section 3', `Growth ${i} (knit)`, 'WS', 'Knit.', ws3g, `Wave 3 growth rep ${i} of 23.`);
  ws3g++;
  addRow('Wave Section 3', `Growth ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws3g, `Wave 3 growth rep ${i} of 23.`);
}
addRow('Wave Section 3', 'Growth final knit', 'WS', 'Knit. — 93 sts total (38 before marker, 55 after).', 93, 'End of Wave Section 3. Ready for Wave Section 4.');

// WAVE SECTION 4 ── YOUR STARTING POSITION
const WS4_START = PATTERN.length; // index of WS4 Row 1

addRow('Wave Section 4', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 4 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 94 sts.', 94, 'Wave Section 4 begins. 7 waves total in this section.');
addRow('Wave Section 4', 'Row 2', 'WS', 'Knit.', 94, 'Wave Section 4. ← YOU STARTED HERE');
addRow('Wave Section 4', 'Row 3', 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', 95, 'Wave Section 4.');

// Row 4 = WS knit (YOUR CURRENT ROW)
addRow('Wave Section 4', 'Row 4', 'WS', 'Knit.', 95, 'Wave Section 4. YOUR CURRENT ROW.');

addRow('Wave Section 4', 'Row 5 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 4 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 96, 'Wave row! Repeat rows 3-6 five more times for 7 waves total.');
addRow('Wave Section 4', 'Row 6', 'WS', 'Knit.', 96, 'Wave Section 4.');

let ws4c = 96;
for (let rep = 2; rep <= 6; rep++) {
  ws4c++;
  addRow('Wave Section 4', `Rep ${rep} Row 3`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws4c, `Wave Section 4 repeat ${rep-1} of 5 (7 waves total per pattern).`);
  addRow('Wave Section 4', `Rep ${rep} Row 4`, 'WS', 'Knit.', ws4c, `Wave Section 4 repeat ${rep-1} of 5 (7 waves total per pattern).`);
  ws4c++;
  addRow('Wave Section 4', `Rep ${rep} Row 5 (wave)`, 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 4 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', ws4c, `Wave Section 4 repeat ${rep-1} of 5 (7 waves total per pattern).`);
  addRow('Wave Section 4', `Rep ${rep} Row 6`, 'WS', 'Knit.', ws4c, `Wave Section 4 repeat ${rep-1} of 5 (7 waves total per pattern).`);
}
let ws4g = 106;
for (let i = 1; i <= 23; i++) {
  addRow('Wave Section 4', `Growth ${i} (knit)`, 'WS', 'Knit.', ws4g, `Wave 4 growth rep ${i} of 23.`);
  ws4g++;
  addRow('Wave Section 4', `Growth ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws4g, `Wave 4 growth rep ${i} of 23.`);
}
addRow('Wave Section 4', 'Growth final knit', 'WS', 'Knit. — 129 sts total (38 before marker, 91 after).', 129, 'End of Wave Section 4. Ready for Wave Section 5.');

// WAVE SECTION 5
addRow('Wave Section 5', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 130 sts.', 130, 'Wave Section 5 begins. 9 waves total in this section.');
addRow('Wave Section 5', 'Row 2', 'WS', 'Knit.', 130, 'Wave Section 5.');
addRow('Wave Section 5', 'Row 3 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 131, 'Wave row! Repeat rows 3-4 seven more times for 9 waves total.');
addRow('Wave Section 5', 'Row 4', 'WS', 'Knit.', 131, 'Wave Section 5.');
let ws5c = 131;
for (let rep = 2; rep <= 8; rep++) {
  ws5c++;
  addRow('Wave Section 5', `Rep ${rep} Row 3 (wave)`, 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 6 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', ws5c, `Wave Section 5 repeat ${rep-1} of 7 (9 waves total per pattern).`);
  addRow('Wave Section 5', `Rep ${rep} Row 4`, 'WS', 'Knit.', ws5c, `Wave Section 5 repeat ${rep-1} of 7 (9 waves total per pattern).`);
}
let ws5g = 138;
for (let i = 1; i <= 27; i++) {
  addRow('Wave Section 5', `Growth ${i} (knit)`, 'WS', 'Knit.', ws5g, `Wave 5 growth rep ${i} of 27.`);
  ws5g++;
  addRow('Wave Section 5', `Growth ${i} (inc)`, 'RS', 'K1, yo, knit to marker, slip marker, knit to end — 1 st increased.', ws5g, `Wave 5 growth rep ${i} of 27.`);
}
addRow('Wave Section 5', 'Growth final knit', 'WS', 'Knit. — 165 sts total (38 before marker, 127 after).', 165, 'End of Wave Section 5. Ready for Wave Section 6.');

// WAVE SECTION 6
addRow('Wave Section 6', 'Row 1', 'RS', 'K1, yo, k1, remove marker and place it after this st, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 8 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 166 sts.', 166, 'Wave Section 6 begins. 11 waves total — home stretch!');
addRow('Wave Section 6', 'Row 2', 'WS', 'Knit.', 166, 'Wave Section 6.');
addRow('Wave Section 6', 'Row 3 (wave)', 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 8 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', 167, 'Wave row! Repeat rows 3-4 nine more times for 11 waves total.');
addRow('Wave Section 6', 'Row 4', 'WS', 'Knit.', 167, 'Wave Section 6.');
let ws6c = 167;
for (let rep = 2; rep <= 10; rep++) {
  ws6c++;
  addRow('Wave Section 6', `Rep ${rep} Row 3 (wave)`, 'RS', 'K1, yo, knit to marker, slip marker, [k2tog] 3 times, *[k1, yo] 6 times, [k2tog] 6 times; repeat from * 8 times, [k1, yo] 6 times, [k2tog] 3 times, k1 — 1 st increased.', ws6c, `Wave Section 6 repeat ${rep-1} of 9 (11 waves total per pattern).`);
  addRow('Wave Section 6', `Rep ${rep} Row 4`, 'WS', 'Knit.', ws6c, `Wave Section 6 repeat ${rep-1} of 9 (11 waves total per pattern).`);
}
addRow('Wave Section 6', 'Bind Off', 'RS', 'Bind off loosely. — 176 sts total.\n\nFinishing: Weave in ends. Wet block to measurements. Pin out the points on the bind-off edge while the shawl is wet to bring out the lace pattern.', 176, '🌊 Done! Block and enjoy your Waterline shawl.');

// ─── FIND YOUR STARTING INDEX ────────────────────────────────────────────────
// Wave Section 4 Row 4 (WS) = current row
const START_INDEX = PATTERN.findIndex(r => r.section === 'Wave Section 4' && r.rowLabel === 'Row 4');

// ─── STATE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'waterline_row';
let currentIndex = parseInt(localStorage.getItem(STORAGE_KEY) ?? START_INDEX);
if (isNaN(currentIndex) || currentIndex < 0) currentIndex = START_INDEX;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const total = PATTERN.length;
  const row = PATTERN[currentIndex];

  // save
  localStorage.setItem(STORAGE_KEY, currentIndex);

  // progress
  const pct = Math.round((currentIndex / (total - 1)) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `Row ${currentIndex + 1} of ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';

  // section chip
  document.getElementById('section-label').textContent = row.section;

  // card header
  document.getElementById('row-display').textContent = row.rowLabel;
  const badge = document.getElementById('row-side-badge');
  badge.textContent = row.side;
  badge.className = 'row-side ' + row.side.toLowerCase().replace(' side','');

  // instructions
  document.getElementById('row-instructions').innerHTML =
    row.instructions.replace(/\n/g, '<br>');

  // stitch note
  const noteEl = document.getElementById('stitch-note');
  if (row.stitchCount) {
    noteEl.style.display = 'block';
    noteEl.textContent = `Stitch count after this row: ${row.stitchCount} sts`;
  } else {
    noteEl.style.display = 'none';
  }

  // stitch count display
  const scEl = document.getElementById('stitch-count-display');
  if (row.stitchCount) {
    scEl.innerHTML = `<strong>${row.stitchCount}</strong> stitches`;
  } else {
    scEl.innerHTML = '';
  }

  // wave context
  document.getElementById('wave-context').innerHTML =
    `<strong>Context</strong>${row.context}`;

  // nav
  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').disabled = currentIndex === total - 1;

  // completion
  const isLast = currentIndex === total - 1;
  document.getElementById('completion').classList.toggle('show', isLast);
  document.getElementById('row-card').style.display = isLast ? 'none' : 'block';
  document.getElementById('wave-context').style.display = isLast ? 'none' : 'block';
  document.getElementById('stitch-count-display').style.display = isLast ? 'none' : 'flex';
}

function jumpToRow() {
  var sectionInput = document.getElementById('jump-section').value.trim().toLowerCase();
  var rowInput = document.getElementById('jump-row').value.trim().toLowerCase();
  var feedback = document.getElementById('jump-feedback');

  if (!sectionInput && !rowInput) {
    feedback.textContent = 'Enter a section and/or row to jump to.';
    return;
  }

  var candidates = PATTERN.map(function(r, i) { return { r: r, i: i }; });

  if (sectionInput) {
    candidates = candidates.filter(function(c) {
      return c.r.section.toLowerCase().indexOf(sectionInput) !== -1;
    });
  }
  if (rowInput) {
    candidates = candidates.filter(function(c) {
      return c.r.rowLabel.toLowerCase().indexOf(rowInput) !== -1;
    });
  }

  if (candidates.length === 0) {
    feedback.style.color = '#ff6b6b';
    feedback.textContent = 'No matching row found. Try a shorter search, e.g. "Section 3" and "Row 1".';
    return;
  }

  currentIndex = candidates[0].i;
  render();
  feedback.style.color = '#7fdc7f';
  feedback.textContent = 'Jumped to ' + candidates[0].r.section + ' — ' + candidates[0].r.rowLabel + '.';
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next >= 0 && next < PATTERN.length) {
    currentIndex = next;
    render();
  }
}

render();

  // Register service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
